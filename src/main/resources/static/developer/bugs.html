<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assigned Bugs — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Assigned Bugs">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Assigned Bugs</h4>
                    <button class="btn btn-outline-secondary btn-sm" onclick="exportAllBugs()"><i class="bi bi-download"></i> Export</button>
                </div>
                <div class="card-panel">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Project</th><th>Title</th><th>Priority</th><th>Status</th><th>Raised By</th><th>SLA</th></tr>
                            </thead>
                            <tbody id="bugsList"><tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/export.js"></script>
    <script>
        auth.requireRole(['Developer']);
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('bugsList');
            try {
                const bugs = await api.get('/bugs/my-assigned');
                if (!bugs.length) {
                    list.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No bugs assigned to you</td></tr>';
                    return;
                }
                list.innerHTML = bugs.map(b => `
                    <tr class="bug-row" data-href="/developer/bug-details.html?id=${b.bugId}">
                        <td>#${b.bugId}</td>
                        <td>${utils.escapeHtml(b.projectName || '-')}</td>
                        <td class="fw-medium">${utils.escapeHtml(b.title)}</td>
                        <td><span class="badge ${utils.getPriorityBadgeClass(b.priority)}">${b.priority}</span></td>
                        <td><span class="badge ${utils.getStatusBadgeClass(b.status)}">${b.status}</span></td>
                        <td>${utils.escapeHtml(b.raisedBy || '-')}</td>
                        <td>${utils.formatSla(b)}</td>
                    </tr>`).join('');
                utils.bindBugRowClicks(list);
            } catch (err) {
                list.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
