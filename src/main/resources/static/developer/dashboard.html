<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Developer Dashboard">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="row g-4 mb-4">
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">Assigned to Me</p>
                            <h3 id="statAssigned" class="mb-0">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">In Progress</p>
                            <h3 id="statProgress" class="mb-0">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">Resolved</p>
                            <h3 id="statResolved" class="mb-0">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">SLA Overdue</p>
                            <h3 id="statOverdue" class="mb-0 text-danger">0</h3>
                        </div>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">My Assigned Bugs</h6>
                        <a href="/developer/bugs.html" class="btn btn-sm btn-outline-primary">View All</a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>SLA</th></tr>
                            </thead>
                            <tbody id="recentList"><tr><td colspan="5" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        auth.requireRole(['Developer']);
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const bugs = await api.get('/bugs/my-assigned');
                const now = new Date();
                document.getElementById('statAssigned').textContent = bugs.length;
                document.getElementById('statProgress').textContent = bugs.filter(b => b.status === 'In Progress').length;
                document.getElementById('statResolved').textContent = bugs.filter(b => b.status === 'Resolved').length;
                document.getElementById('statOverdue').textContent = bugs.filter(b =>
                    b.dueDate && new Date(b.dueDate) < now && b.status !== 'Closed' && b.status !== 'Resolved'
                ).length;

                const list = document.getElementById('recentList');
                if (!bugs.length) {
                    list.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No bugs assigned yet</td></tr>';
                    return;
                }
                list.innerHTML = bugs.slice(0, 8).map(b => `
                    <tr style="cursor:pointer" onclick="location.href='/developer/bug-details.html?id=${b.bugId}'">
                        <td>#${b.bugId}</td>
                        <td>${utils.escapeHtml(b.title)}</td>
                        <td><span class="badge ${utils.getPriorityBadgeClass(b.priority)}">${b.priority}</span></td>
                        <td><span class="badge ${utils.getStatusBadgeClass(b.status)}">${b.status}</span></td>
                        <td>${utils.formatSla(b)}</td>
                    </tr>`).join('');
            } catch (err) {
                document.getElementById('recentList').innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
