<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugTrack — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="mb-3"><i class="bi bi-bug-fill text-danger" style="font-size:2.5rem"></i></div>
                <a href="/login.html" class="brand-logo d-inline-block" style="color:#0f172a">Bug<span>Track</span></a>
                <p class="text-muted mt-2 mb-0">Smart Bug Tracking &amp; Project Management</p>
            </div>
            <form id="loginForm">
                <div id="errorAlert" class="alert alert-danger d-none"></div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="you@company.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <p class="text-center text-muted small mt-4 mb-0">
                BugTrack — T.Y.B.Sc. Project · University of Mumbai
            </p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        if (auth.isAuthenticated()) auth.redirectBasedOnRole();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorAlert = document.getElementById('errorAlert');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorAlert.classList.add('d-none');

            try {
                const res = await api.post('/auth/login', {
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value
                });
                auth.login(res.token, {
                    email: res.email,
                    role: res.role,
                    fullName: res.fullName
                });
            } catch (err) {
                errorAlert.textContent = err.message || 'Invalid credentials';
                errorAlert.classList.remove('d-none');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
