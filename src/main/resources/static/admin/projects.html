<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Project Management">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Projects</h4>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createProjectModal">
                        <i class="bi bi-plus-circle"></i> New Project
                    </button>
                </div>
                <div class="row g-4" id="projectsGrid">
                    <div class="col-12 text-center py-5 text-muted">Loading projects...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div class="modal fade" id="createProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createProjectForm">
                        <div class="mb-3">
                            <label class="form-label">Project Name</label>
                            <input type="text" class="form-control" id="projectName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="projectDesc" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Members Modal -->
    <div class="modal fade" id="membersModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="membersModalTitle">Project Members</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assignMemberForm" class="row g-2 mb-4 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label small">User</label>
                            <select class="form-select form-select-sm" id="memberUserId" required></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Role in Project</label>
                            <select class="form-select form-select-sm" id="memberRole" required>
                                <option value="Developer">Developer</option>
                                <option value="Tester">Tester</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary btn-sm w-100">Add Member</button>
                        </div>
                    </form>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
                            <tbody id="membersList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        auth.requireRole(['Admin', 'Project Manager']);
        let currentProjectId = null;
        let membersModal;

        async function loadProjects() {
            const grid = document.getElementById('projectsGrid');
            try {
                const projects = await api.get('/projects');
                if (!projects.length) {
                    grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No projects yet. Create your first project.</div>';
                    return;
                }
                grid.innerHTML = projects.map(p => `
                    <div class="col-md-4">
                        <div class="card-panel project-card h-100 p-4" onclick="openMembers(${p.projectId}, '${utils.escapeHtml(p.projectName).replace(/'/g, "\\'")}')">
                            <div class="d-flex justify-content-between mb-2">
                                <h5 class="mb-0 text-primary">${utils.escapeHtml(p.projectName)}</h5>
                                <span class="badge bg-light text-dark">${utils.escapeHtml(p.status || 'Active')}</span>
                            </div>
                            <p class="text-muted small mb-2">${utils.escapeHtml(p.description || 'No description')}</p>
                            <p class="small mb-0"><i class="bi bi-person"></i> ${utils.escapeHtml(p.createdBy || 'System')}</p>
                            <p class="small text-muted"><i class="bi bi-calendar"></i> ${utils.formatDateTime(p.createdAt)}</p>
                            <button class="btn btn-sm btn-outline-primary mt-2" onclick="event.stopPropagation(); openMembers(${p.projectId}, '${utils.escapeHtml(p.projectName).replace(/'/g, "\\'")}')">
                                Manage Members
                            </button>
                        </div>
                    </div>`).join('');
            } catch (err) {
                grid.innerHTML = `<div class="col-12 text-danger">${utils.escapeHtml(err.message)}</div>`;
            }
        }

        async function loadMemberOptions() {
            const select = document.getElementById('memberUserId');
            try {
                const [devs, testers] = await Promise.all([
                    api.get('/users/role/Developer'),
                    api.get('/users/role/Tester')
                ]);
                const users = [...devs, ...testers];
                select.innerHTML = '<option value="">Select user</option>' +
                    users.map(u => `<option value="${u.userId}">${utils.escapeHtml(u.fullName)} — ${utils.escapeHtml(u.roleName)}</option>`).join('');
            } catch {
                select.innerHTML = '<option value="">Unable to load users</option>';
            }
        }

        async function loadMembers() {
            if (!currentProjectId) return;
            const list = document.getElementById('membersList');
            try {
                const members = await api.get(`/projects/${currentProjectId}/members`);
                if (!members.length) {
                    list.innerHTML = '<tr><td colspan="4" class="text-muted">No members assigned</td></tr>';
                    return;
                }
                list.innerHTML = members.map(m => `
                    <tr>
                        <td>${utils.escapeHtml(m.fullName)}</td>
                        <td>${utils.escapeHtml(m.email)}</td>
                        <td><span class="badge bg-secondary">${utils.escapeHtml(m.roleInProject)}</span></td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="removeMember(${m.assignmentId})"><i class="bi bi-trash"></i></button></td>
                    </tr>`).join('');
            } catch (err) {
                list.innerHTML = `<tr><td colspan="4" class="text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        }

        window.openMembers = async (projectId, name) => {
            currentProjectId = projectId;
            document.getElementById('membersModalTitle').textContent = `Members — ${name}`;
            await loadMemberOptions();
            await loadMembers();
            membersModal.show();
        };

        window.removeMember = async (assignmentId) => {
            if (!confirm('Remove this member from the project?')) return;
            try {
                await api.delete(`/projects/members/${assignmentId}`);
                utils.showToast('Member removed');
                loadMembers();
            } catch (err) {
                utils.showToast(err.message, 'danger');
            }
        };

        document.getElementById('createProjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.post('/projects', {
                    projectName: document.getElementById('projectName').value.trim(),
                    description: document.getElementById('projectDesc').value.trim()
                });
                bootstrap.Modal.getInstance(document.getElementById('createProjectModal')).hide();
                e.target.reset();
                utils.showToast('Project created');
                loadProjects();
            } catch (err) {
                utils.showToast(err.message, 'danger');
            }
        });

        document.getElementById('assignMemberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.post(`/projects/${currentProjectId}/members`, {
                    userId: parseInt(document.getElementById('memberUserId').value),
                    roleInProject: document.getElementById('memberRole').value
                });
                utils.showToast('Member added');
                loadMembers();
            } catch (err) {
                utils.showToast(err.message, 'danger');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            membersModal = new bootstrap.Modal(document.getElementById('membersModal'));
            loadProjects();
        });
    </script>
</body>
</html>
