<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bugs — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Bug Tracking">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <h4 class="mb-0">All Bugs</h4>
                    <button class="btn btn-outline-secondary btn-sm" onclick="exportAllBugs()"><i class="bi bi-download"></i> Export</button>
                </div>

                <div class="filter-bar d-flex flex-wrap gap-3 align-items-end">
                    <div class="flex-grow-1">
                        <label class="form-label small">Search</label>
                        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search by title or project...">
                    </div>
                    <div>
                        <label class="form-label small">Status</label>
                        <select class="form-select form-select-sm" id="filterStatus">
                            <option value="">All Statuses</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label small">Priority</label>
                        <select class="form-select form-select-sm" id="filterPriority">
                            <option value="">All Priorities</option>
                        </select>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th><th>Project</th><th>Title</th>
                                    <th>Priority</th><th>Status</th><th>Assigned To</th><th>SLA</th>
                                </tr>
                            </thead>
                            <tbody id="bugsList">
                                <tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/export.js"></script>
    <script>
        auth.requireRole(['Admin', 'Project Manager']);
        let allBugs = [];

        function renderBugs(bugs) {
            const list = document.getElementById('bugsList');
            if (!bugs.length) {
                list.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No bugs found</td></tr>';
                return;
            }
            list.innerHTML = bugs.map(b => utils.renderBugTableRow(b, '/admin/bug-details.html')).join('');
            utils.bindBugRowClicks(list);
        }

        function applyFilters() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;
            const priority = document.getElementById('filterPriority').value;
            const filtered = allBugs.filter(b => {
                const matchQ = !q || b.title.toLowerCase().includes(q) || (b.projectName || '').toLowerCase().includes(q);
                const matchStatus = !status || b.status === status;
                const matchPriority = !priority || b.priority === priority;
                return matchQ && matchStatus && matchPriority;
            });
            renderBugs(filtered);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            utils.BUG_STATUSES.forEach(s => {
                document.getElementById('filterStatus').innerHTML += `<option value="${s}">${s}</option>`;
            });
            utils.PRIORITIES.forEach(p => {
                document.getElementById('filterPriority').innerHTML += `<option value="${p}">${p}</option>`;
            });

            ['searchInput', 'filterStatus', 'filterPriority'].forEach(id => {
                document.getElementById(id).addEventListener('input', applyFilters);
                document.getElementById(id).addEventListener('change', applyFilters);
            });

            try {
                allBugs = await utils.fetchAllBugs();
                renderBugs(allBugs);
            } catch (err) {
                document.getElementById('bugsList').innerHTML =
                    `<tr><td colspan="7" class="text-center text-danger py-4">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
