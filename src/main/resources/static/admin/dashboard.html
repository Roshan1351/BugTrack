<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Admin Dashboard">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h4 class="mb-1">Overview</h4>
                        <p class="text-muted mb-0">Monitor bugs, SLA breaches, and team workload</p>
                    </div>
                    <button class="btn btn-outline-secondary btn-sm" onclick="exportAllBugs()">
                        <i class="bi bi-download"></i> Export CSV
                    </button>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <p class="text-muted mb-1 small">Total Bugs</p>
                                    <h3 class="mb-0" id="statTotal">0</h3>
                                </div>
                                <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-bug"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <p class="text-muted mb-1 small">Open / Active</p>
                                    <h3 class="mb-0" id="statOpen">0</h3>
                                </div>
                                <div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-hourglass-split"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <p class="text-muted mb-1 small">Resolved / Closed</p>
                                    <h3 class="mb-0" id="statResolved">0</h3>
                                </div>
                                <div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-check-circle"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="stat-card p-4">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <p class="text-muted mb-1 small">SLA Breached</p>
                                    <h3 class="mb-0 text-danger" id="statSla">0</h3>
                                </div>
                                <div class="stat-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-exclamation-triangle"></i></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-5">
                        <div class="card-panel">
                            <div class="card-header"><h6 class="mb-0">Bugs by Status</h6></div>
                            <div class="card-body"><canvas id="statusChart" height="220"></canvas></div>
                        </div>
                    </div>
                    <div class="col-lg-7">
                        <div class="card-panel">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0">Recent Bugs</h6>
                                <a href="/admin/bugs.html" class="btn btn-sm btn-outline-primary">View All</a>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th></tr>
                                    </thead>
                                    <tbody id="recentBugsList">
                                        <tr><td colspan="4" class="text-center py-4 text-muted">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/export.js"></script>
    <script>
        auth.requireRole(['Admin', 'Project Manager']);

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const bugs = await utils.fetchAllBugs();
                const now = new Date();
                const closedStatuses = ['Resolved', 'Closed'];

                document.getElementById('statTotal').textContent = bugs.length;
                document.getElementById('statOpen').textContent = bugs.filter(b => !closedStatuses.includes(b.status)).length;
                document.getElementById('statResolved').textContent = bugs.filter(b => closedStatuses.includes(b.status)).length;
                document.getElementById('statSla').textContent = bugs.filter(b =>
                    !closedStatuses.includes(b.status) && b.dueDate && new Date(b.dueDate) < now
                ).length;

                const list = document.getElementById('recentBugsList');
                if (!bugs.length) {
                    list.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No bugs yet</td></tr>';
                } else {
                    list.innerHTML = bugs.slice(0, 8).map(b => `
                        <tr style="cursor:pointer" onclick="location.href='/admin/bug-details.html?id=${b.bugId}'">
                            <td>#${b.bugId}</td>
                            <td class="fw-medium">${utils.escapeHtml(b.title)}</td>
                            <td><span class="badge ${utils.getPriorityBadgeClass(b.priority)}">${b.priority}</span></td>
                            <td><span class="badge ${utils.getStatusBadgeClass(b.status)}">${b.status}</span></td>
                        </tr>`).join('');
                }

                const statusCounts = {};
                bugs.forEach(b => { statusCounts[b.status] = (statusCounts[b.status] || 0) + 1; });
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(statusCounts),
                        datasets: [{
                            data: Object.values(statusCounts),
                            backgroundColor: ['#6366f1','#f59e0b','#10b981','#ef4444','#64748b','#0ea5e9','#a855f7','#94a3b8']
                        }]
                    },
                    options: { plugins: { legend: { position: 'bottom' } } }
                });
            } catch (err) {
                document.getElementById('recentBugsList').innerHTML =
                    `<tr><td colspan="4" class="text-center text-danger py-4">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
