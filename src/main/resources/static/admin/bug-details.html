<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Details — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Bug Details">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="mb-3">
                    <a href="/admin/bugs.html" class="btn btn-sm btn-light"><i class="bi bi-arrow-left"></i> Back to Bugs</a>
                </div>
                <h4 id="pageTitle" class="mb-1">Bug Details</h4>
                <h5 id="bugTitle" class="text-muted mb-4"></h5>

                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card-panel mb-4">
                            <div class="card-body" id="bugDetailsBody">Loading...</div>
                        </div>
                        <div class="card-panel">
                            <div class="card-header"><h6 class="mb-0">Comments &amp; Discussion</h6></div>
                            <div class="card-body">
                                <div id="commentsList" class="d-flex flex-column gap-3 mb-4">Loading...</div>
                                <form id="addCommentForm" class="border-top pt-3">
                                    <textarea class="form-control mb-2" id="commentText" rows="3" placeholder="Write a comment..." required></textarea>
                                    <button type="submit" class="btn btn-primary btn-sm">Post Comment</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card-panel mb-4 d-none" id="assignCard">
                            <div class="card-header"><h6 class="mb-0">Assign Developer</h6></div>
                            <div class="card-body">
                                <form id="assignBugForm">
                                    <select class="form-select form-select-sm mb-3" id="developerId" required></select>
                                    <button type="submit" class="btn btn-outline-primary btn-sm w-100">Assign</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-panel mb-4">
                            <div class="card-header"><h6 class="mb-0">Update Status</h6></div>
                            <div class="card-body">
                                <form id="updateStatusForm">
                                    <select class="form-select form-select-sm mb-3" id="newStatus" required></select>
                                    <textarea class="form-control form-control-sm mb-3" id="statusRemarks" rows="2" placeholder="Remarks (optional)"></textarea>
                                    <button type="submit" class="btn btn-primary btn-sm w-100">Update Status</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-panel">
                            <div class="card-header"><h6 class="mb-0">Status History</h6></div>
                            <div class="card-body"><div class="timeline" id="historyTimeline"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/bug-details.js"></script>
    <script>
        auth.requireRole(['Admin', 'Project Manager']);
        bugDetailsPage.init();
        bugDetailsPage.loadDevelopersForAssign();
    </script>
</body>
</html>
