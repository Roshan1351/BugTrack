<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="User Management">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="card-panel">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="mb-0">All Users</h6>
                                <span class="badge bg-primary" id="userCount">0</span>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
                                    </thead>
                                    <tbody id="usersList">
                                        <tr><td colspan="5" class="text-center py-4 text-muted">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="card-panel">
                            <div class="card-header"><h6 class="mb-0">Register New User</h6></div>
                            <div class="card-body">
                                <form id="registerForm">
                                    <div id="alertBox" class="alert d-none"></div>
                                    <div class="mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="fullName" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" minlength="6" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label">Role</label>
                                        <select class="form-select" id="role" required>
                                            <option value="Admin">Admin</option>
                                            <option value="Project Manager">Project Manager</option>
                                            <option value="Developer">Developer</option>
                                            <option value="Tester">Tester</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Create User</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        auth.requireRole(['Admin']);

        async function loadUsers() {
            const list = document.getElementById('usersList');
            try {
                const users = await api.get('/users');
                document.getElementById('userCount').textContent = users.length;
                if (!users.length) {
                    list.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No users</td></tr>';
                    return;
                }
                list.innerHTML = users.map(u => `
                    <tr>
                        <td class="fw-medium">${utils.escapeHtml(u.fullName)}</td>
                        <td>${utils.escapeHtml(u.email)}</td>
                        <td><span class="badge bg-secondary">${utils.escapeHtml(u.roleName)}</span></td>
                        <td>${u.isActive ? '<span class="text-success">Active</span>' : '<span class="text-danger">Inactive</span>'}</td>
                        <td>
                            ${u.isActive
                                ? `<button class="btn btn-sm btn-outline-danger"
                                        onclick="deactivateUser(${u.userId})">
                                    <i class="bi bi-person-x"></i> Deactivate
                                </button>`
                            : `<button class="btn btn-sm btn-outline-success"
                                        onclick="activateUser(${u.userId})">
                                    <i class="bi bi-person-check"></i> Activate
                            </button>`
                            }
                        </td>
                    </tr>`).join('');
            } catch (err) {
                list.innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        }

        window.deactivateUser = async (id) => {
            if (!confirm('Deactivate this user?')) return;
            try {
                await api.delete(`/users/${id}`);
                utils.showToast('User deactivated');
                loadUsers();
            } catch (err) {
                utils.showToast(err.message, 'danger');
            }
        };

        window.activateUser = async (id) => {
            if (!confirm('Activate this user?')) return;
            try {
                await api.patch(`/users/${id}/activate`);
                utils.showToast('User activated successfully!');
                loadUsers();
            } catch (err) {
                utils.showToast(err.message, 'danger');
            }
        };

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const alertBox = document.getElementById('alertBox');
            btn.disabled = true;
            alertBox.className = 'alert d-none';
            try {
                await api.post('/users', {
                    fullName: document.getElementById('fullName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    roleName: document.getElementById('role').value
                });
                alertBox.textContent = 'User created successfully!';
                alertBox.className = 'alert alert-success';
                e.target.reset();
                loadUsers();
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.className = 'alert alert-danger';
            } finally {
                btn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
