<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bugs — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="My Raised Bugs">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">My Raised Bugs</h4>
                    <a href="/tester/raise-bug.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle"></i> Raise Bug</a>
                </div>
                <div class="card-panel">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>ID</th><th>Project</th><th>Title</th><th>Priority</th><th>Status</th><th>Assigned To</th><th>SLA</th></tr>
                            </thead>
                            <tbody id="bugsList"><tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        auth.requireRole(['Tester']);
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('bugsList');
            try {
                const bugs = await api.get('/bugs/my-raised');
                if (!bugs.length) {
                    list.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No bugs found. <a href="/tester/raise-bug.html">Raise your first bug</a></td></tr>';
                    return;
                }
                list.innerHTML = bugs.map(b => utils.renderBugTableRow(b, '/tester/bug-details.html')).join('');
                utils.bindBugRowClicks(list);
            } catch (err) {
                list.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
