<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Bug — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Raise Bug">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="card-panel max-w-900 mx-auto">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="bi bi-bug"></i> Report a New Bug</h5>
                        <p class="text-muted small mb-0 mt-1">Duplicate detection runs automatically. Use "Check Duplicates" before submitting.</p>
                    </div>
                    <div class="card-body">
                        <form id="raiseBugForm">
                            <div class="mb-3">
                                <label class="form-label">Project <span class="text-danger">*</span></label>
                                <select class="form-select" id="projectId" required>
                                    <option value="">Select project</option>
                                </select>
                                <div id="projectHelp" class="form-text">Only projects assigned to you are listed.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Title <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="title" placeholder="Brief summary of the bug" required>
                                    <button class="btn btn-outline-secondary" type="button" id="btnCheckDup">
                                        <i class="bi bi-search"></i> Check Duplicates
                                    </button>
                                </div>
                                <div id="dupResult" class="mt-2"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="description" rows="4" required placeholder="What happened? What was expected?"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Steps to Reproduce</label>
                                <textarea class="form-control" id="stepsToReproduce" rows="3" placeholder="1. Go to...&#10;2. Click...&#10;3. See error"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Priority <span class="text-danger">*</span></label>
                                    <select class="form-select" id="priority" required></select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Severity <span class="text-danger">*</span></label>
                                    <select class="form-select" id="severity" required></select>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Screenshot / Attachment</label>
                                <input class="form-control" type="file" id="attachment" accept="image/*,.pdf,.png,.jpg,.jpeg">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Submit Bug</button>
                                <a href="/tester/bugs.html" class="btn btn-light">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        auth.requireRole(['Tester']);

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('priority').innerHTML = utils.PRIORITIES.map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('severity').innerHTML = utils.SEVERITIES.map(s => `<option value="${s}">${s}</option>`).join('');

            try {
                const projects = await api.get('/projects');
                const select = document.getElementById('projectId');
                if (!projects.length) {
                    select.innerHTML = '<option value="">No assigned project</option>';
                    select.disabled = true;
                    document.getElementById('projectHelp').innerHTML =
                        '<span class="text-danger">You are not allocated to any project. Ask Admin or Project Manager to assign you first.</span>';
                    document.querySelector('#raiseBugForm button[type="submit"]').disabled = true;
                    return;
                }
                projects.forEach(p => {
                    select.innerHTML += `<option value="${p.projectId}">${utils.escapeHtml(p.projectName)}</option>`;
                });
            } catch (err) {
                utils.showToast('Failed to load projects: ' + err.message, 'danger');
            }
        });

        document.getElementById('btnCheckDup').addEventListener('click', async () => {
            const projectId = document.getElementById('projectId').value;
            const title = document.getElementById('title').value.trim();
            const resDiv = document.getElementById('dupResult');
            if (!projectId || !title) {
                resDiv.innerHTML = '<span class="text-danger small">Select a project and enter a title first.</span>';
                return;
            }
            resDiv.innerHTML = '<span class="text-muted small">Checking for similar bugs...</span>';
            try {
                const res = await api.get(`/bugs/duplicate-check?projectId=${projectId}&title=${encodeURIComponent(title)}`);
                const parsed = utils.parseDuplicateResponse(res);
                if (parsed.hasDuplicates) {
                    let html = `<div class="alert alert-warning py-2 mb-0"><strong>${utils.escapeHtml(parsed.message)}</strong><ul class="mb-0 mt-2 small">`;
                    parsed.similarBugs.forEach(b => {
                        html += `<li>#${b.bugId}: ${utils.escapeHtml(b.title)} (${b.similarityPercent}% similar)</li>`;
                    });
                    html += '</ul></div>';
                    resDiv.innerHTML = html;
                } else {
                    resDiv.innerHTML = `<span class="text-success small"><i class="bi bi-check-circle"></i> ${utils.escapeHtml(parsed.message || 'No similar bugs found')}</span>`;
                }
            } catch (err) {
                resDiv.innerHTML = `<span class="text-danger small">${utils.escapeHtml(err.message)}</span>`;
            }
        });

        document.getElementById('raiseBugForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            try {
                const createdBug = await api.post('/bugs', {
                    projectId: parseInt(document.getElementById('projectId').value),
                    title: document.getElementById('title').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    stepsToReproduce: document.getElementById('stepsToReproduce').value.trim(),
                    priorityName: document.getElementById('priority').value,
                    severityName: document.getElementById('severity').value
                });

                const fileInput = document.getElementById('attachment');
                if (fileInput.files.length > 0) {
                    const fileData = new FormData();
                    fileData.append('file', fileInput.files[0]);
                    await api.post(`/bugs/${createdBug.bugId}/attachments`, fileData);
                }

                utils.showToast('Bug submitted successfully!');
                setTimeout(() => { window.location.href = '/tester/bugs.html'; }, 800);
            } catch (err) {
                utils.showToast(err.message, 'danger');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
