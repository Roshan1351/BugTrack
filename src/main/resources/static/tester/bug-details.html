<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Details — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Bug Details">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <a href="/tester/bugs.html" class="btn btn-sm btn-light mb-3"><i class="bi bi-arrow-left"></i> Back</a>
                <h4 id="pageTitle" class="mb-1">Bug Details</h4>
                <h5 id="bugTitle" class="text-muted mb-4"></h5>
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="card-panel mb-4"><div class="card-body" id="bugDetailsBody">Loading...</div></div>
                        <div class="card-panel">
                            <div class="card-header"><h6 class="mb-0">Comments</h6></div>
                            <div class="card-body">
                                <div id="commentsList" class="d-flex flex-column gap-3 mb-4"></div>
                                <form id="addCommentForm" class="border-top pt-3">
                                    <textarea class="form-control mb-2" id="commentText" rows="3" required></textarea>
                                    <button type="submit" class="btn btn-primary btn-sm">Post Comment</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card-panel mb-4">
                            <div class="card-header"><h6 class="mb-0">Re-Test / Close Bug</h6></div>
                            <div class="card-body">
                                <p class="small text-muted">As a tester, update status to Re-Testing, Closed, Reopened, or Rejected.</p>
                                <form id="updateStatusForm">
                                    <select class="form-select form-select-sm mb-3" id="newStatus" required></select>
                                    <textarea class="form-control form-control-sm mb-3" id="statusRemarks" rows="2" placeholder="Re-test notes"></textarea>
                                    <button type="submit" class="btn btn-primary btn-sm w-100">Update Status</button>
                                </form>
                            </div>
                        </div>
                        <div class="card-panel"><div class="card-header"><h6 class="mb-0">History</h6></div>
                            <div class="card-body"><div class="timeline" id="historyTimeline"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/bug-details.js"></script>
    <script>
        auth.requireRole(['Tester']);
        bugDetailsPage.init();
    </script>
</body>
</html>
