<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Notifications">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Notifications</h4>
                    <button class="btn btn-outline-primary btn-sm" id="markAllBtn"><i class="bi bi-check2-all"></i> Mark All Read</button>
                </div>
                <div class="card-panel" id="notifList"><div class="text-center py-5 text-muted">Loading...</div></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/notifications.js"></script>
    <script>
        auth.requireRole(['Tester']);
        notificationsPage.init('/tester/bug-details.html');
    </script>
</body>
</html>
