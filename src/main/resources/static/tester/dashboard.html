<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tester Dashboard — BugTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page-title="Tester Dashboard">
    <div class="main-wrapper">
        <div id="sidebar" class="sidebar"></div>
        <div class="flex-grow-1 d-flex flex-column">
            <div id="topnav"></div>
            <div class="content-area">
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">Bugs Raised</p>
                            <h3 id="statRaised" class="mb-0">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">Pending Re-Test</p>
                            <h3 id="statRetest" class="mb-0">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card p-4">
                            <p class="text-muted small mb-1">Closed</p>
                            <h3 id="statClosed" class="mb-0">0</h3>
                        </div>
                    </div>
                </div>

                <div class="card-panel p-4 mb-4">
                    <h5 class="mb-3">Quick Actions</h5>
                    <a href="/tester/raise-bug.html" class="btn btn-primary me-2 mb-2"><i class="bi bi-plus-circle"></i> Raise New Bug</a>
                    <a href="/tester/bugs.html" class="btn btn-outline-secondary me-2 mb-2"><i class="bi bi-bug"></i> My Bugs</a>
                    <a href="/tester/notifications.html" class="btn btn-outline-secondary mb-2"><i class="bi bi-bell"></i> Notifications</a>
                </div>

                <div class="card-panel">
                    <div class="card-header"><h6 class="mb-0">Recently Raised Bugs</h6></div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light"><tr><th>ID</th><th>Title</th><th>Status</th><th>SLA</th></tr></thead>
                            <tbody id="recentList"><tr><td colspan="4" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        auth.requireRole(['Tester']);
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const bugs = await api.get('/bugs/my-raised');
                document.getElementById('statRaised').textContent = bugs.length;
                document.getElementById('statRetest').textContent = bugs.filter(b => b.status === 'Resolved').length;
                document.getElementById('statClosed').textContent = bugs.filter(b => b.status === 'Closed').length;
                const list = document.getElementById('recentList');
                if (!bugs.length) {
                    list.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No bugs raised yet</td></tr>';
                    return;
                }
                list.innerHTML = bugs.slice(0, 6).map(b => `
                    <tr style="cursor:pointer" onclick="location.href='/tester/bug-details.html?id=${b.bugId}'">
                        <td>#${b.bugId}</td>
                        <td>${utils.escapeHtml(b.title)}</td>
                        <td><span class="badge ${utils.getStatusBadgeClass(b.status)}">${b.status}</span></td>
                        <td>${utils.formatSla(b)}</td>
                    </tr>`).join('');
            } catch (err) {
                document.getElementById('recentList').innerHTML = `<tr><td colspan="4" class="text-danger text-center">${utils.escapeHtml(err.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
