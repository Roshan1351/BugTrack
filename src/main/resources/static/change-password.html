<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugTrack — Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/BugTrack_Logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="mb-3"><i class="bi bi-shield-lock-fill text-primary" style="font-size:2.5rem"></i></div>
                <h4 class="mb-1">Change Password</h4>
                <p class="text-muted small">Update your BugTrack account password</p>
            </div>
            <form id="changePasswordForm">
                <div id="errorAlert" class="alert alert-danger d-none"></div>
                <div id="successAlert" class="alert alert-success d-none"></div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="email@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Old Password</label>
                    <input type="password" class="form-control" id="oldPassword" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Change Password</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login.html" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            
            btn.disabled = true;
            btn.textContent = 'Changing...';
            errorAlert.classList.add('d-none');
            successAlert.classList.add('d-none');

            try {
                // Adjust the API endpoint based on my actual backend route
                const res = await api.post('/auth/change-password', {
                    email: document.getElementById('email').value.trim(),
                    oldPassword: document.getElementById('oldPassword').value,
                    newPassword: document.getElementById('newPassword').value
                });
                
                // show success message on change password webpage
                successAlert.textContent = res.message || 'Password changed successfully! You can now login with your new password.';
                successAlert.classList.remove('d-none');
                
                // for reset the form
                e.target.reset();
                
                // redirect to login webpage after 3 second (3 second for smooth handling)
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
            } catch (err) {
                errorAlert.textContent = err.message || 'Failed to change password. Please check your credentials.';
                errorAlert.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Change Password';
            }
        });
    </script>
</body>
</html>
